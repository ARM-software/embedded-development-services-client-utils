[ProjectConfig]
# Only path variables can and must contain 'DIR', 'PATH' or 'ROOT' in their name as
# these tokens are used to identify path variables from other variable types.
PROJECT_NAME = "Arm embedded development services HTTP client utilities"
PACKAGE_NAME = "embedded-development-services-client-utils"
PROJECT_UUID = '21b15d04-4096-4b72-9e32-44cc28fcb4fe'
PROJECT_ROOT = "."
NEWS_DIR = "changes/"
SOURCE_DIR = "utils"
RELEASE_BRANCH_PATTERN = "^release.*$"
MODULE_TO_DOCUMENT = "utils"
DOCUMENTATION_DEFAULT_OUTPUT_PATH = "./docs"
DOCUMENTATION_PRODUCTION_OUTPUT_PATH = "./docs"
VERSION_FILE_PATH = "./module.properties"
CHANGELOG_FILE_PATH = "CHANGELOG.md"
AWS_BUCKET=""
PROGRAMMING_LANGUAGE = "Golang"
MASTER_BRANCH = "main"
FAIL_ON_INCOMPLETE_LICENCE_AUDIT = true
GENERATE_LICENSING_SUMMARY_ON_RELEASE = true

[ProjectConfig.PACKAGES_WITH_CHECKED_LICENCE]
"github.com/klauspost/compress" = { licence = "BSD-3-Clause AND Apache-2.0", reason = "Upstream LICENSE is mixed: the module is BSD-3-Clause overall and gzhttp/* is Apache-2.0." }
"github.com/stretchr/testify/internal/spew" = { licence = "ISC", reason = "testify/internal/spew ships its own ISC-licensed code under internal/spew/LICENSE." }

[AutoVersionConfig]
CONFIG_NAME = "JAVA"
PRERELEASE_TOKEN = "beta"
BUILD_TOKEN = "dev"
TAG_TEMPLATE = "release/{version}"
targets = [ "./module.properties",]

[AutoVersionConfig.key_aliases]
Version = "VERSION_KEY"
MajorVersion = "major"
MinorVersion = "minor"
PatchVersion = "patch"
CommitHash = "COMMIT"

[AutoVersionConfig.trigger_patterns]
major = "changes/*.major"
minor = "changes/*.feature"
patch = "changes/*.bugfix"

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
package = "embedded-development-services-client-utils"
title_format = "# {version} ({project_date})"
start_string = """
[//]: # (begin_release_notes)
"""

[[tool.towncrier.type]]
directory = "major"
name = "Major changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false

[spdx]
CreatorWebsite = "spdx.org"
PathToSpdx = "spdx/spdxdocs"
UUID="7bd87d35-e224-4fbd-8058-4f88fd3064e2"
