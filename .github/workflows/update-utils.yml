name: Update Library

# Set environment variables available in all jobs and steps
env:
  python_version: "3.11"
  go_version: "1.27.3"

on:
  workflow_call:
    inputs:
      branch:
        description:
          "Branch to commit updated utils changes to:"
        type: string
        required: false

jobs:
  update-go:
    name: Update Go
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        # So that we have correct GIT_TOKEN to push back to branch as we need workflow permissions
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ inputs.branch || github.head_ref || github.ref }}
    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.python_version }}
    - name: Install continuous-delivery-scripts
      run: |
        python -m pip install --upgrade 'continuous-delivery-scripts>=4.8.0'
        pip list
    - name: License files
      run: |
        cd-license-files
    - name: Checkout Update Go action
      uses: actions/checkout@v7.0.1
      with:
        repository: Arm-Debug/update-go-action
        ref: refs/tags/latest
        token: ${{ secrets.ARM_SOFTWARE_TOKEN || github.token }}
        persist-credentials: false
        path: ./.github/workflows/update-go-action
    - name: Update Go
      continue-on-error: true
      uses: ./.github/workflows/update-go-action
      with:
        dockerfile: Dockerfile.utils
        branch: ${{ inputs.branch || github.head_ref || github.ref }}

  discover-go-modules:
    name: Discover Go modules
    needs:
      - update-go
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.branch || github.head_ref || github.ref }}
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.go_version }}
    - name: Sync workspace
      uses: ARM-software/golang-utils/actions/sync-go-workspace@v1.172.0
    - name: Discover modules from workspace
      id: discover
      shell: python
      run: |
        import json
        import os
        import pathlib
        import subprocess

        workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        output = subprocess.check_output(["go", "list", "-m", "-json"], cwd=workspace, text=True)

        decoder = json.JSONDecoder()
        index = 0
        modules = []
        while index < len(output):
          while index < len(output) and output[index].isspace():
            index += 1
          if index >= len(output):
            break
          module, index = decoder.raw_decode(output, index)
          module_dir = pathlib.Path(module["Dir"]).resolve()
          modules.append(module_dir.relative_to(workspace).as_posix())

        modules = sorted(modules)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
          handle.write(f"modules={json.dumps(modules)}\n")

  build-and-test:
    name: Build and Test
    needs:
      - update-go
      - discover-go-modules
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit
    with:
      branch: ${{ inputs.branch || github.head_ref || github.ref }}
      go-modules: ${{ needs.discover-go-modules.outputs.modules }}
