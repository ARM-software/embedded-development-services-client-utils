name: GitHub Release

env:
  go_version: "1.27.3"
  python_version: "3.11"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description:
          "Enter type of release to perform (i.e. development, beta, release):"
        required: true

jobs:
  check-for-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check.outputs.changes }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check if changes directory contains files
        id: check
        run: |
            CHANGES=$(git show main:changes/ 2>/dev/null | grep -e .feature -e .bugfix -e .major -e .doc -e .misc)
            echo "changes<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
        continue-on-error: true # in case '2>/dev/null' doesn't work

  release:
    name: Carry out a release
    runs-on: ubuntu-latest
    needs: [ check-for-changes ]
    if: needs.check-for-changes.outputs.changes
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Get the full history as this is required by goreleaser
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}
      - uses: FranzDiebold/github-env-vars-action@v2
      - name: Install CI/CD tools
        run: python -m pip install --upgrade 'continuous-delivery-scripts>=4.8.0' && pip list
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          distribution: goreleaser
          version: latest
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Download Go dependencies for every module
        uses: ARM-software/golang-utils/actions/go-multimodules@v1.172.0
        with:
          task: download
      - name: Tag and release
        run: cd-tag-and-release -b "${CI_ACTION_REF_NAME}" -t ${{ github.event.inputs.release_type }} -vv
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
